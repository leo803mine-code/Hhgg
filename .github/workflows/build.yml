name: build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Locate project
        run: |
          echo "== files =="
          find . -maxdepth 5 -not -path './.git/*' | sort | head -100
          S=$(find . -maxdepth 5 -type d -path '*/src/main/java' | awk '{print length, $0}' | sort -n | head -1 | cut -d' ' -f2-)
          if [ -z "$S" ]; then echo "ERROR: папка src/main/java не найдена в репозитории"; exit 1; fi
          R=$(cd "$S/../../.." && pwd)
          echo "ROOT=$R" >> $GITHUB_ENV
          if [ ! -f "$R/src/main/java/dev/flr/visuals/CosmeticsScreen.java" ]; then echo "ERROR: в src нет новых файлов 1.3.0"; exit 1; fi
          if [ ! -f "$R/settings.gradle" ]; then
          cat > "$R/settings.gradle" <<'EOF'
          pluginManagement { repositories { gradlePluginPortal(); maven { url = 'https://maven.neoforged.net/releases' } } }
          rootProject.name = 'flrvisuals'
          EOF
          fi
          if [ ! -f "$R/build.gradle" ]; then
          cat > "$R/build.gradle" <<'EOF'
          plugins { id 'java'; id 'net.neoforged.moddev' version '1.0.21' }
          version = '1.3.0'
          group = 'dev.flr'
          base { archivesName = 'flrvisuals' }
          java.toolchain.languageVersion = JavaLanguageVersion.of(21)
          neoForge {
              version = '21.1.172'
              runs { client { client() } }
              mods { flrvisuals { sourceSet sourceSets.main } }
          }
          EOF
